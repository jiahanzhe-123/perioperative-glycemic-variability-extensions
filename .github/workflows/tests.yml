name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install -r requirements.txt

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.0"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            survival
            sandwich
            lmtest
            ggplot2
          needs: check

      - name: Python unit tests
        run: python3 -m pytest tests/pytest -q

      - name: R unit tests
        run: Rscript tests/testthat/run_tests.R

      - name: Synthetic end-to-end workflow
        run: |
          python3 data/synthetic/make_synthetic.py
          Rscript analyses/09_quality_control/99_synthetic_workflow.R

      - name: Synthetic outputs are not study results (sentinel check)
        run: |
          test -f results/machine_readable/synthetic/synthetic_workflow_results.csv
          echo "synthetic workflow completed"
