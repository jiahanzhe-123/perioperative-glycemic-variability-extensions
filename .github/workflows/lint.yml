name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal deps
        run: pip install pyyaml pandas
      - name: Sensitive information scan
        run: python3 scripts/sensitive_scan.py
      - name: Config / YAML / CSV schema checks
        run: python3 scripts/check_configs.py
      - name: No large files
        run: |
          big=$(find . -type f -size +2M -not -path "./.git/*")
          if [ -n "$big" ]; then echo "Large files found:"; echo "$big"; exit 1; fi
